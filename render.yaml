# Render blueprint for Invoice Bridge.
# Secrets are declared with sync:false so they are set in the Render
# dashboard rather than committed to the repository.
services:
  - type: web
    name: invoice-bridge
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    # No persistent disk needed: uploaded PDFs are stored in Postgres.
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RENTMANAGER_BASE_URL
        sync: false
      - key: RENTMANAGER_USERNAME
        sync: false
      - key: RENTMANAGER_PASSWORD
        sync: false
      - key: RENTMANAGER_LOCATION_ID
        value: "1"
      # Email intake (IMAP). Optional — leave unset to disable email ingestion.
      # The same values can instead be entered (password encrypted) in Settings.
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_MAILBOX
        value: INBOX
      - key: IMAP_ALLOWED_SENDERS
        sync: false
      - key: EMAIL_AUTO_PUSH
        value: "true"
