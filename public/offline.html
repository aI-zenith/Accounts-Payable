<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Zenith Group</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1320; color: #e6e8ec; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
      .o { max-width: 320px; }
      img { width: 64px; height: 74px; margin-bottom: 18px; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #9aa0ab; margin: 0 0 22px; }
      button { background: #2b5fd9; color: #fff; border: none; border-radius: 10px; padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="o">
      <img src="/img/zenith-mark.svg" alt="" />
      <h1>You're offline</h1>
      <p>Zenith Group needs a connection to load this page. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
